[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laiaudio"
version = "1.0.0"
description = "Live meeting captions with local AI: real-time English transcription, Spanish translation and Markdown transcripts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Paolium" }]
requires-python = ">=3.11"
# GTK4, libadwaita and PyGObject come from the system on Linux (install.sh) and from the gvsbuild runtime on
# Windows (install.ps1)
dependencies = [
    "numpy",
    "onnx-asr",
    "ctranslate2",
    "sentencepiece",
    "python-xlib; sys_platform == 'linux'",  # floating captions on GNOME / X11
]

[project.optional-dependencies]
# install.sh and install.ps1 pick one depending on whether there is an NVIDIA GPU
nvidia = ["onnxruntime-gpu[cuda,cudnn]"]
cpu = ["onnxruntime"]

[project.urls]
Homepage = "https://github.com/Paolium/laiaudio"
Paolium = "https://paolium.web.app/"

[tool.setuptools.packages.find]
include = ["laiaudio*"]

[tool.setuptools.package-data]
laiaudio = ["data/*.svg", "data/*.ico"]
